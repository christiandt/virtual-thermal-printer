<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Virtual Thermal Printer</title>
		<meta name="color-scheme" content="light dark" />
		<meta
			name="theme-color"
			media="(prefers-color-scheme: light)"
			content="#f0f0f0"
		/>
		<meta
			name="theme-color"
			media="(prefers-color-scheme: dark)"
			content="#121212"
		/>
		<link rel="stylesheet" href="style.css" />
		<link rel="icon" href="/icons/any_icon_x512.png" type="image/png">
		<link rel="manifest" href="/webmanifest.json">
		<script type="module" src="script.js"></script>
	</head>
	<body>
		<span id="version"></span>
		<aside id="device-panel" class="device-panel" hidden>
			<div id="printer" class="device-row">
				<span class="device-light" aria-hidden="true"></span>
				<span class="device-label">Printer <strong id="printer-state" aria-live="polite">on line</strong></span>
			</div>
			<div class="device-toggles" role="group" aria-label="Printer conditions">
				<button type="button" data-condition="coverOpen" aria-pressed="false">Cover open</button>
				<button type="button" data-condition="paperNearEnd" aria-pressed="false">Paper low</button>
				<button type="button" data-condition="paperEnd" aria-pressed="false">Paper out</button>
				<label class="device-response">
					Answers
					<select id="printer-response">
						<option value="0">at once</option>
						<option value="2000">after 2 s</option>
						<option value="5000">after 5 s</option>
						<option value="10000">after 10 s</option>
						<option value="20000">after 20 s</option>
						<option value="never">never to print jobs</option>
					</select>
				</label>
			</div>
			<div id="drawer" class="device-row">
				<span class="device-light" aria-hidden="true"></span>
				<span class="device-label">Cash drawer <strong id="drawer-state" aria-live="polite">closed</strong></span>
				<button type="button" id="drawer-toggle">Open</button>
			</div>
		</aside>
		<div class="content">
			<div id="printer-output">
				<div class="placeholder">
					<h1>Virtual Thermal Printer</h1>
					<div class="placeholder-surface">
						<img src="/icons/original.png" alt="" width="507" height="431" />
						<p id="placeholder-text">Waiting for instructions…</p>
					</div>
				</div>
				<div class="paper">
					<div class="paper-content"></div>
				</div>
			</div>
		</div>
		<script>
			if ('serviceWorker' in navigator) {
				window.addEventListener('load', () => {
					navigator.serviceWorker.register('/serviceWorker.js')
				})
			}
		</script>
	</body>
</html>
