name: Build

on:
  push:
    branches:
      - '**'

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

      # The desktop app's main process must still bundle. Its own
      # dependencies are installed without scripts, so Electron itself is not
      # downloaded for this check.
      - name: Bundle the desktop app
        working-directory: packages/desktop
        run: |
          npm ci --ignore-scripts
          npm run build
